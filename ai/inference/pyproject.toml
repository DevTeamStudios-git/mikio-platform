[project]
name = "mikio-ai-inference"
version = "0.1.0"
description = "Mikio AI — inference service (FastAPI). Serves the STR model to backend/ over HTTP; never imported directly by the NestJS side. See ARCHITECTURE.md §4/§5/§7 and TECH_STACK.md §7."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
